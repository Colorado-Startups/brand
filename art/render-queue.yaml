# art/render-queue.yaml: every render the brand needs, by status (owner S7).
#
# Rebuilt 2026-11-14 for decisions 37 to 49. Routes, in order (decisions 41 and 42): the own
# ZeroGPU Space paul-co-startups/brand-fibo through art/render/fibo_cards.py; Modal
# (`modal run art/render/fibo_cards.py::<entry>`); Bria's hosted credit, capped at $6.00 and not
# wired yet. Money, lanes and duties: art/LICENSES.md. Each batch runs
# `python3 tools/fibo_budget.py reserve N` first and reads the lane's balances before and after
# (~/.claude/rules/compute.md). The finish plan's standing yes covers at most 60 FIBO calls, then
# stop (decision 48). Any other batch waits for Paul's yes in chat with its estimate.
#
# Precedence: decisions.md wins; art/LICENSES.md wins on routes and money; art/DIRECTION.md and
# art/motion.md win on the look; art/fibo-calls.yaml wins on how many FIBO calls have run. If they
# disagree with this file, fix this file in the same session.
#
# Every figure carries a source, says "computed here", or is marked goal: true.
#
# Keys
#   rates       the limits every batch uses, each with its source
#   totals      the in-progress sums, computed here from the items
#   done        shipped renders, with their files
#   in_progress renders running now (none)
#   deferred    renders kept for later (decisions 44 and 48)
#   dropped     items of the v4 queue that decisions 37 to 45 replaced, kept as a record
#   items carry: id; what, in plain words; entry, the fibo_cards.py entry or the tool;
#     seed or calls (FIBO calls spent); output, the shipped file; decision

rates:
  fibo_calls_per_month:
    value: 1950
    source: "decision 35; counted in art/fibo-calls.yaml by tools/fibo_budget.py"
  hf_pro_zerogpu:
    minutes_per_day: 40
    credit_usd: 2.00
    source: "decision 41; `xlarge` spends the minutes at twice the rate"
  bria_hosted_credit:
    usd_per_call: 0.032
    cap_usd: 6.00
    source: "decision 42; art/bria-credit.yaml"

totals:
  computed: here, from the calls of the logo and character items below
  fibo_calls_spent_under_decision_48: 16
  fibo_calls_cap: 60
  fibo_calls_cap_source: "decision 48, one standing yes"
  fibo_calls_this_month: "see art/fibo-calls.yaml; decision 50 read 97 of 1,950"

