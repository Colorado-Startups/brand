# art/render-queue.yaml: every render the brand needs, in run order (owner S7).
#
# Nothing here has run. Items run on the $0 lanes in art/LICENSES.md (decision 31):
# LTX-2.5 clips now, FIBO 2.0 stills after Paul's billing call on Bria's Free plan.
# `route` below still names the old Comfy node; S14 maps each to its lane. Every
# batch asks in chat first, with its estimate, and reads the lane's balance
# before and after (~/.claude/rules/compute.md).
#
# Precedence: art/LICENSES.md wins on routes; ~/.claude/rules/compute.md wins on
# tiers and on asking before each run; art/DIRECTION.md and art/motion.md win
# on the look. If they disagree with this file, fix this file in the same session.
#
# Every figure carries a source, says "computed here", or is marked goal: true.
#
# Keys
#   rates      the prices every estimate uses, each with its source
#   totals     the queue's sums, computed here from rates and items
#   items      one entry per render job, in run order:
#     id         a stable name; the render's files and provenance record use it
#     phase      pilot (compare FIBO 2.0 with the shipped art first), still, edit, upscale or clip
#     what       the picture or clip, in plain words
#     replaces   the shipped website file it would replace (website art/finals.json), or null
#     template   the art/prompts template, or the approved stills it starts from
#     keeper     for a keeper portrait, the sheet in art/keepers/
#     model      the model, as named in art/LICENSES.md
#     route      the Comfy Cloud node or template
#     tier       the run tier in ~/.claude/rules/compute-detail.md
#     size       the node or clip settings
#     takes      how many renders to choose from: a plan, so goal: true
#     estimate   credits for the item, with the rate it uses
#     needed_if  a condition; an item without one is always needed
#     status     "blocked: paul-queue-1-2" until both queue items clear

rates:
  bria_node_run:
    credits: 12.07
    source: "Comfy Partner Node pricing (https://docs.comfy.org/tutorials/partner-nodes/pricing), per run of a Bria FIBO 2.0 node, as recorded in the website's art/LICENSES.md at origin/main c6f10bc, read 2026-11-02"
  credits_per_dollar:
    value: 211
    source: "Computed in the website's art/LICENSES.md from `comfy cloud status` (4,082 credits for $19.35), 2026-11-02"
  open_weight_gpu_time:
    credits: null
    source: "Comfy publishes no per-run rate for template runs; plan credits pay for active GPU time (comfy.org/pricing, per the website's art/LICENSES.md, read 2026-11-02). The first approved run measures it."
  ltx_paid_node_reference:
    credits_per_second_720p: 27.16
    source: "Comfy Partner Node pricing, LTX-2.5 Fast node, per the website's art/LICENSES.md, read 2026-11-02"
    note: "A ceiling for comparison only. This queue uses the open-weight templates, not this node. At this rate one 9.7 s take would cost about 264 credits (computed here)."

totals:
  computed: here, from rates and the items below
  bria_runs: 55
  bria_credits: 663.85
  bria_dollars: 3.15
  bria_runs_if_no_conditional: 51
  bria_credits_if_no_conditional: 615.57
  gpu_jobs: 22
  gpu_credits: null
  gpu_credits_note: "No published rate for open-weight template runs (rates.open_weight_gpu_time). The pilot clip measures it before any batch."

