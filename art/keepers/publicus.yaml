# art/keepers/publicus.yaml: the fixed picture sheet for one keeper (owner S7).
#
# FIBO 2.0 reads words, so the keeper's look is written once here and pasted
# verbatim into every caption that shows this keeper: the portrait template
# (art/prompts/keeper.vgl.json) and any hero or scene. Only `location` and
# `relationship`, plus the fields in `per_image`, are written per image.
#
# Precedence: who the keeper is, and its disclosure, come from
# baseline/v2/dwarves.yaml (the website's data/team/dwarves.yaml at 18b65a6).
# If that file and this one disagree, that file wins; fix this one in the same
# session. Colors are token roles; tokens/brand_tokens.yaml sets the values.
# Rules: art/DIRECTION.md, "The keepers".
#
# Keys
#   id, name, kind, title  copied from baseline/v2/dwarves.yaml
#   disclosure             copied verbatim from the same file; it ships beside every picture, in HTML
#   disclosure_source      where the disclosure text comes from
#   sheet                  the look in short labels: age, beard or hair, clothing,
#                          color anchor (a token role), prop and silhouette
#   objects_entry          FIXED. One VGL `objects` entry. Paste it verbatim, then add
#                          `location` and `relationship` for the image
#   per_image              the VGL object fields a caption may also set per image
#   portrait               FIXED for the portrait template: background and crops
#   alt_text               alt text for any picture of this keeper; it says the keeper is an AI agent
#   continuity             the shipped picture this sheet follows, what changed, and why
#   never                  what never appears in a picture of this keeper

id: publicus
name: Publicus
kind: dwarf
title: Herald of the Hall

disclosure: Publicus is an AI agent run by Colorado Startups. It can make mistakes, so it only drafts; a person reviews and publishes everything.
disclosure_source: baseline/v2/dwarves.yaml, entry publicus, field disclosure (website data/team/dwarves.yaml at 18b65a6)

sheet:
  kind: dwarf man
  age: young
  beard_or_hair: a copper-red beard in a single long braid
  clothing: an ember-orange herald's tabard with gold trim over a cream shirt; a jaunty ember-orange cap with one long cream feather; a leather satchel stuffed with rolled letters
  color_anchor:
    token: fire
    in_words: ember orange
  prop: a fresh, blank broadsheet held up high
  silhouette: stout, a feathered cap, a broadsheet raised above the head

objects_entry:
  description: A lively young stout dwarf herald with a copper-red beard in a single long braid and a proud grin. He holds a fresh, blank printed broadsheet up high in one hand. A leather satchel stuffed with rolled letters and blank scrolls hangs at his hip.
  shape_and_color: A stout figure in a bold block of ember orange from cap to tabard, trimmed in gold, with a white rectangle of paper raised above.
  texture: woven wool, worn leather and crisp paper
  clothing: An ember-orange herald's tabard with gold trim over a cream shirt, and a jaunty ember-orange cap with one long cream feather.
  appearance_details: The broadsheet and the scrolls are blank.
  gender: male

per_image: [location, relationship, relative_size, orientation, pose, expression, action]

portrait:
  background_setting: A sunny print workshop carved in warm sandstone, with a wooden printing press, blank pages drying on lines and warm lantern light. The background is soft and low in detail.
  crops:
    large: {ratio: "4:5", size: [960, 1200], use: team page and keeper panels, goal: true}
    small: {ratio: "1:1", size: [320, 320], use: avatars at 40 to 96 px, goal: true}
    source: baseline/v2/art-DIRECTION.md, Portrait files (website art/DIRECTION.md at 18b65a6, read 2026-11-02)

alt_text: "Publicus, Herald of the Hall, an AI agent run by Colorado Startups, pictured as a dwarf holding up a blank broadsheet."

continuity:
  follows: keeper-publicus-1, the shipped pick (website art/concepts/batch-1.md, picked 2026-10-18)
  changes:
    - what: The cap is stated as ember orange, with one cream feather.
      why: >-
        At 64 px he is told apart as the warm keeper with no cool note (website
        art/concepts/batch-1.md). One block of ember from cap to tabard makes
        that anchor read first.
    - what: His age is stated as young.
      why: The three keepers now read apart by age as well as color (middle-aged, old, young).

never:
  - a weapon, armor or a horn
  - readable text, letters or a masthead on the broadsheet
  - a cool color on his clothing; sky blue belongs to Communitas
