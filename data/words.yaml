watch:
  rule: Never use these as a Hall name, place, material, title or item. Each stays out of `never` because it is also a real name or a common word, and a gate blocks only on the certain. A gate may warn on them.
  source: [web-franchise-rule, claude-md, s3]
  items:
    - term: Zelda
      franchise: zelda
      why: A real first name. The series' full title blocks instead.
    - term: Link
      franchise: zelda
      why: A common word. Never name a character or keeper Link.
    - term: Ocarina
      franchise: zelda
      why: A real instrument. Only "Ocarina of Time" blocks.
    - term: Majora
      franchise: zelda
      why: A real given name. Only "Majora's Mask" blocks.
    - term: Gimli
      franchise: tolkien
      why: Also a town in Manitoba, and a name from Norse myth.
    - term: Thorin
      franchise: tolkien
      why: A name from Norse myth that people carry.
    - term: mithril
      franchise: tolkien
      why: Mithril Capital is a real investor. Never call a Hall metal mithril.
    - term: Arkenstone
      franchise: tolkien
      why: An iconic item. Name a real Colorado mineral instead.
    - term: Hearthstone
      franchise: warcraft
      why: A game's name and an iconic item, though "hearth" and "hearthstone" are common words. Say "hearth".
    - term: Tinker Town
      franchise: warcraft
      why: The MMO's gnome district. Say "workshop" or "the Map Room".
    - term: Mountain King
      franchise: warcraft
      why: A title of the MMO's dwarves, and an old song title. Never a keeper or seat title.
    - term: Cirth
      franchise: tolkien
      why: The film dwarves' runic script. The brand draws no runes and names none.
    - term: Khuzdul
      franchise: tolkien
      why: The dwarves' invented language. The brand uses no invented-language words.

banned_seat_words:
  scope: Volunteer seat titles, seat pages, the seat application form and seat entries on the Team page. Elsewhere these words keep their ordinary use; "hiring" is a welcome-desk door for founders.
  words: [paid, pay, salary, stipend, hiring, hire, job]
  pattern: '\b(?:paid|pays?|salar(?:y|ies)|stipends?|hiring|hires?|hired|jobs?|contributors?)\b'
  case_sensitive: false
  allowed: [unpaid, reimbursed, volunteer]
  rules:
    - Costs a seat holder is repaid for are "reimbursed", never "paid".
    - '"Contributor" means a Startupers writer or a code contributor. It never names a community seat, so the pattern also catches it.'
    - 'Each of the four application seats, and the application form, says once: "An unpaid volunteer role."'
    - '"Volunteer" is allowed on the four application seats only: Slack Community Lead and the Photon Mountain, Fusion Canyon and Space Peak Connectors. The other four seats keep website decision 44 until Paul says they are unpaid.'
  source: [web-d67, web-d44, web-seats-test]

ai_tells:
  severity: warn
  flags: [ignorecase, multiline]
  source: [house, voice-lint]
  items:
    - tell: delve
      instead: look at, dig into
      pattern: '\bdelve\b'
    - tell: tapestry
      instead: cut the spatial metaphor
      pattern: '\btapestry\b'
    - tell: plethora
      instead: many, a lot of
      pattern: '\bplethora\b'
    - tell: seamless, seamlessly
      instead: say what actually happens
      pattern: '\bseamless(ly)?\b'
    - tell: game-changer
      instead: name the specific change
      pattern: '\bgame[- ]changer\b'
    - tell: a testament to
      instead: state the fact directly
      pattern: '\ba testament to\b'
    - tell: it's important to note
      instead: just say the thing
      pattern: 'it(?:''|’)?s important to note|it is important to note'
    - tell: in today's fast-paced / ever-evolving world
      instead: cut the opener
      pattern: 'in (today(?:''|’)?s|an?) (fast-paced|ever-evolving|rapidly evolving)'
    - tell: navigating the complexities
      instead: say what you do
      pattern: 'navigat(e|ing) the complexit'
    - tell: look no further
      instead: cut it
      pattern: 'look no further'
    - tell: Certainly, Absolutely, Of course as an opener
      instead: start with the answer
      pattern: '^\s*(Certainly|Absolutely|Of course)[,!]'
    - tell: In conclusion, In summary, In essence
      instead: stop when you are done
      pattern: '(^|\s)(in conclusion|in summary|in essence)[,:]'
    - tell: it's not just X, it's Y
      instead: write the affirmative
      pattern: 'it(?:''|’)?s not (just|only) .{1,60}, it(?:''|’)?s'

hedges:
  severity: warn
  rule: Cut the hedge. Say the thing, or say you do not know.
  source: house
  words: [arguably, perhaps, somewhat, potentially, seemingly, essentially, basically, virtually, sort of, more or less, to some extent]
  gate_also_warns:
    note: voice_lint.py warns on these too. "Rather" and "quite" have honest uses, so the gate warns and never blocks.
    source: [voice-lint, web-site-rules]
    words: [probably, maybe, fairly, rather, quite, relatively, appears to, seems to, could be, might be, may be, kind of, generally, in some sense]

off_limits_topics:
  rule: The brand never covers these. The website's and LinkedIn's own gates enforce them.
  topics:
    - Political or election content.
    - Fund talk, or anything that asks people to invest.
    - The terms of the leadership transition.
    - Unattributed member counts.
    - Any claim that a partner or government backs Colorado Startups, unless it is signed.
  source: [v2-voice, voice-card]

style:
  - id: colorado-not-co
    rule: Write "Colorado", never "CO".
    pattern: '\bCO\b'
    case_sensitive: true
    severity: warn
    except: Postal addresses, where the post office expects the abbreviation.
    source: [v2-voice, voice-card]
  - id: no-em-dash
    rule: No em dashes and no spaced en dashes. Use a comma, semicolon, period or parentheses. An unspaced en dash in a range is fine.
    characters: [U+2014 em dash, U+2013 en dash with a space on each side]
    severity: block
    source: [house, check-dashes]
  - id: sentence-length
    rule: One idea per sentence. Split any sentence past 30 words.
    max_words: 30
    severity: warn
    source: [house, web-site-rules]
  - id: figures
    rule: Every figure carries its source in the same sentence, or the word "goal".
    severity: warn
    source: [house, claude-md]
  - id: exclamations
    rule: At most one exclamation mark on a page.
    max_per_page: 1
    source: v2-voice
  - id: sentence-case
    rule: UI copy is in sentence case. Buttons say exactly what happens, such as "Join the Slack" or "Nominate a company".
    source: v2-voice
  - id: startupers
    rule: Write "Startupers" as one word with a capital S.
    source: v2-voice
  - id: full-name
    rule: Write "Colorado Startups" in public copy. "CS" is for internal notes only.
    source: s3
  - id: no-silicon-valley
    rule: Never call any place "the Silicon Valley of" anything. Say what its founders build.
    pattern: '\bsilicon\s+valley\s+of\b'
    case_sensitive: false
    severity: block
    source: web-site-rules
  - id: keeper-disclosure
    rule: A sentence that names a keeper also says "AI agent". The full rule is keepers.disclosure_rule in data/voice.yaml.
    source: claude-md
  - id: lore-literal
    rule: Lore words stay out of forms, buttons, policies and errors. The vocabulary rule in data/voice.yaml says where they go.
    source: v2-voice
