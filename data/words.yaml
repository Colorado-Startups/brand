# data/words.yaml: the brand's word lists. Owner: S3 Voice and words.
#
# This is the one data file allowed to name the franchises, because it is the
# banned list. Decision 30 also names them in art/DIRECTION.md, art/direction/ and NOTICE, which
# never ship to dist/. S10's never-words check reads `never` and searches every
# tracked text file for it. It exempts this file, art/DIRECTION.md, art/direction/ and NOTICE.
#
# Precedence.
#   - ai_tells and hedges restate the house rules
#     (~/.claude/rules/writing-and-gates.md). The house rules win any
#     disagreement; fix this file in the same session.
#   - never and never_samples copy the website's franchise-name rule
#     (04_tools/cs_site_rules.json, origin/main c6f10bc, read 2026-11-02).
#     Until Wave 3 (W1) points the website's gate at this file, the website
#     rule wins and this file is fixed to match it. After W1, this file wins.
#   - banned_seat_words copies website decision 67. The website wins until W1.
#   - Everything else here wins over every copy elsewhere.
#
# People may get points, levels and ranks (decisions.md, decision 22), so no
# list here bans those words.
#
# Top-level keys:
#   meta                  version, owner, date, and the sources cited by id.
#   franchises            an id for each of the three franchises, and the
#                         generic words public files use for it.
#   never                 franchise names. Nothing in the brand uses them.
#   never_samples         sentences the never list must catch (hit) and must
#                         pass (miss), for any gate's self-test.
#   watch                 franchise-coined words that stay out of `never`
#                         because each is also a real name or common word.
#                         Advisory: a gate may warn on them, never block.
#   banned_seat_words     words no volunteer seat uses, with the rule's scope.
#   ai_tells              phrasing that reads as machine-written (warn).
#   hedges                hedge words (warn).
#   off_limits_topics     subjects the brand never covers.
#   style                 spelling, punctuation and naming rules.
#
# How to read a `never` entry:
#   term            the display form, for people and for the guide's chips.
#   pattern         the regex. It runs in Python re and in JavaScript RegExp
#                   with the u flag, and carries no inline flags.
#   case_sensitive  false: match ignoring case.
#   franchise       an id from `franchises`.
# Order and patterns match the website rule exactly. To rebuild that rule's
# regex: join the case-insensitive patterns with "|" inside "(?i:" and ")",
# then append "|" and the case-sensitive patterns joined with "|". The PR
# that added this file proves the rebuild matches byte for byte.
#
# The research digest behind the brand names no franchise term this list
# misses. It notes that bare "Zelda" does not block; that is on purpose (see
# watch), so this list adds nothing beyond the website rule.

meta:
  version: v3 draft
  owner: S3 Voice and words
  updated: "2026-11-04"
  sources:
    - id: web-franchise-rule
      what: The website's franchise-name rule in 04_tools/cs_site_rules.json, origin/main c6f10bc, read 2026-11-02. Its _note gives the reason for each case-sensitive term and each name left out.
    - id: web-d90
      what: Website decision 90 (2026-11-02), which extended the rule to more franchise names.
    - id: web-d44
      what: Website decision 44 (2026-10-18). Open positions; no "paid" or "hiring" wording.
    - id: web-d67
      what: Website decision 67 (2026-10-18). Seat titles, the unpaid line and the banned seat words.
    - id: web-seats-test
      what: The website's site/test/dom/l38/seats.test.ts, whose BANNED pattern this file copies.
    - id: house
      what: House rules, ~/.claude/rules/writing-and-gates.md, read 2026-11-02. Canonical for ai_tells and hedges.
    - id: voice-lint
      what: voice_lint.py (Claude-OS tools/voice_lint.py; the website's copy is 04_tools/voice_lint.py at c6f10bc). The gate that warns on AI tells and hedges. Patterns here are copied from it.
    - id: web-site-rules
      what: The website's 04_tools/cs_site_rules.json, rule silicon-valley-of and voice_lint.rules.max_words.
    - id: v2-voice
      what: The v2 voice, baseline/v2/voice.md.
    - id: voice-card
      what: The LinkedIn project's voice card, W3-content/voice-card.md, dated 2026-10-08.
    - id: claude-md
      what: This repo's CLAUDE.md, "Rules that never bend".
    - id: check-dashes
      what: tools/check_dashes.py, which blocks em dashes and spaced en dashes in this repo.
    - id: s3
      what: Decided here by S3, 2026-11-02, under decision 4 (Claude decides). The PR body gives the reason.

franchises:
  source: claude-md
  items:
    - id: warcraft
      generic: a fantasy MMO's dwarves and gnomes and their forge city
    - id: zelda
      generic: a classic adventure game's fire mountain and its town
    - id: tolkien
      generic: high fantasy's mountain dwarves

