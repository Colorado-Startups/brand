# The type in use. Each family names its licence (font licences are law).
# The scale below is the v2 scale, carried over unchanged (decision 51): the website's code reads --t-step-* and
# --t-measure, so dropping them would break it. No new scale was cut; tools/build_guide_data.py writes it to
# dist/tokens.css and dist/tokens.json.
display:
  family: Aileron
  weight: Regular
  use: The name on art and social cards
  licence: CC0 1.0, public domain  # Sora Sagano, dotcolon; the font's own metadata reads "No Rights Reserved"
  source: {url: "https://fontsource.org/fonts/aileron/about", read: "2026-11-14"}
body:
  family: Atkinson Hyperlegible
  use: Web body text, the State's recommended web body font (Digital Guidelines 1.8, decision 56)
  licence: SIL Open Font License 1.1, Braille Institute of America  # shipped in guide/public/fonts with Atkinson-OFL.txt
  source: {url: "https://dcs.colorado.gov/ids/digital-guidelines/design-tokens/typography-fonts-spacing", read: "2026-11-15"}
text:
  family: Trebuchet MS
  use: The fallback for body text, and captions where Atkinson Hyperlegible is not loaded
  licence: System font, never shipped here  # on macOS and Windows
  source: {path: research/color/state.yaml, read: "2026-11-14"}
scale:  # the classic scale (Bringhurst): 15, 18, 21, 24, 36, 48, 60, 72 px; measure is characters per line
  step--1: "0.9375rem"
  step-0: "1.125rem"
  step-1: "1.3125rem"
  step-2: "1.5rem"
  step-3: "2.25rem"
  step-4: "3rem"
  step-5: "3.75rem"
  step-6: "4.5rem"
  measure: "68ch"
