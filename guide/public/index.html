<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colorado Startups brand</title>
<style>
  :root { color-scheme: light; --ground:#FFFBF3; --ink:#2B1D12; --gold:#F0A92B; --night:#14223F; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--ground); color:var(--ink);
         font:18px/1.5 system-ui, -apple-system, sans-serif; padding:24px; box-sizing:border-box; }
  main { max-width:36rem; text-align:center; }
  .bar { height:8px; border-radius:4px; background:linear-gradient(90deg,var(--gold),#E2561C); margin:24px auto; width:60%; }
  a { color:#A3400F; }
</style>
</head>
<body>
<main>
  <h1>Colorado Startups brand</h1>
  <div class="bar" aria-hidden="true"></div>
  <p>The new brand guide is being forged. The source is open on <a href="https://github.com/Colorado-Startups/brand">GitHub</a>.</p>
</main>
</body>
</html>
