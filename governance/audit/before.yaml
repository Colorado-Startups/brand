# Before-audit: every current brand surface, scored before the overhaul (owner S11).
#
# Rubric: governance/audit/rubric.yaml (version 2), which wins over any note here.
# Reference release: v2, the brand in force on the read date (baseline/v2/, plus
# the website's 01_doctrine/ and astro.config.mjs at the commit named below).
# Every source was read, never changed. Private folders and Artifact links are
# withheld on purpose.
#
# `how` says how each surface was read: source (files read), image (viewed),
# sampled (pixel colors computed), inferred (not seen directly). The summary at
# the end is computed from the scores; recompute it if a score changes.

version: 1
rubric_version: 2
release: v2
read_date: "2026-11-02"
website_commit: c6f10bc (Colorado-Startups/coloradostartups-site origin/main, 2026-11-02 18:29 MT)

# Shared score sets. Pages built from one layout or one template share a set.
# The partner pages repeat the partner set's scores and differ only in voice-lint.
score_sets:
  website: &website
    logo-variant: {score: 1, note: "The approved shield (site/public/brand/cs-logo-240.png) shows at 44 px in the header with an added drop shadow (SiteHeader.astro). At 44 px its lettering is about 6 px tall (estimated from the 240 px file), and v2 has no small mark. site/public/favicon.ico is a WebP file, not an ICO."}
    palette: {score: 2, note: "Page and component sources carry no hex value outside site/src/styles/tokens.css, which sync-brand.mjs generates from the v2 tokens. Matches such as #203 are issue numbers in comments."}
    type: {score: 2, note: "Cinzel for headings and Alegreya Sans for body, self-hosted by the Astro Fonts API (site/astro.config.mjs)."}
    voice-lint: {score: 2, note: "No em dash or spaced en dash in the sampled page sources. The tagline comes from one constant (site/src/components/hall/org.ts TAGLINE) and matches website decision 46."}
    clear-space: {score: 2, note: "A 12 px gap (--s-3) beside the 44 px shield, more than a quarter of its height; the header bar pads 12 px above and 16 px below."}
    contrast: {score: 2, note: "The v2 tokens list every pair with its ratio. Recomputed here: text on ground 15.81, copper link on ground 6.17."}
    naming: {score: 2, note: "Colorado Startups, the keepers and the outposts are spelled as baseline/v2/lore.md spells them."}
    register: {score: 2, note: "The Hall on a Hall channel. Keepers are disclosed as AI agents (team page and every keeper card)."}
  partner: &partner
    logo-variant: {score: 1, note: "The approved shield (cs-logo-240.png, same hash as the website's) shows at 22 to 34 px in the partner bar, where its lettering cannot be read. v2 has no small mark."}
    palette: {score: 0, note: "The package palette (Pages/PACKAGE-PALETTE.txt) leads with teal #028EB1 and #02718D, purple #5D4276 and navy #12182B. v2 keeps teal and purple for the logo only, and navy and the greys are off-token."}
    type: {score: 2, note: "Trebuchet MS only, the State's rule for live web text, which decision 11 keeps for co-branded State pages."}
    clear-space: {score: 1, note: "An 8 px gap at the 34 px desktop size is just under a quarter of the logo's height; the narrow layouts keep 6 px at 22 px."}
    contrast: {score: 2, note: "Text sits on #02718D or darker by the package rule. Recomputed here: #5A6472 on #F5F7FA 5.59, #3E4A5C on #F5F7FA 8.37."}
    naming: {score: 2, note: "Colorado Startups in full, in the order State, Colorado Startups, partner."}
    register: {score: 1, note: "A plain layout fits these Core pages, but v2 defines no Core register, so the pages improvise one."}
  oct6_logo: &oct6_logo {score: 0, note: "A standalone social graphic with the name in a letterspaced kicker and no logo."}

