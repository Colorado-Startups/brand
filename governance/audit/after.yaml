# After-audit: the surfaces the v3 work changed, scored against v3.0.0-alpha.5 (owner S11).
#
# Rubric: governance/audit/rubric.yaml (version 2), which wins over any note here.
# Reference release: v3.0.0-alpha.5 (https://github.com/Colorado-Startups/brand/releases/tag/v3.0.0-alpha.5):
# the three logo tiers in dist/logo/ (decision 50), dist/tokens.css (decision 51), Aileron for the name and
# Trebuchet MS for text (tokens/type.yaml), no master tagline (decision 46), AI-made labels in image metadata
# (decisions 8 and 46), and a project's own tagline kept (decision 48).
# Scope, per the finish plan: only the surfaces this work changed. The LinkedIn kit, signatures, carousels,
# volunteer and partner pages, the Oct 6 set, the website's own pages and the private repos were not touched by it,
# so they are not re-scored here; the before-audit's numbers stand for them.
# Every source was read, never changed.
#
# `how` says how each surface was read: source (files read), image (viewed), sampled (pixel values computed),
# inferred (not seen directly). The summary at the end is computed from the scores; recompute it if a score changes.

version: 1
rubric_version: 2
release: v3.0.0-alpha.5
read_date: "2026-11-14"

# Rows the rubric's channel_registers map leaves out. Marked assumed, as the rubric does, until
# data/architecture.yaml (registers.by_channel) or the rubric sets them.
assumptions:
  brand-guide: "assumed core: its readers are developers, partners and press meeting the brand cold. It is not in the rubric's map."
  github-repos: "assumed core for every repo README and social card, by the org profile's own reason (decision 11 and data/architecture.yaml). architecture.yaml lets a Core piece carry Hall art when its words stay plain, so a card with painted art and only a name scores as Core. The three outposts' READMEs are a sub-brand's own page (rubric na)."
  card-contrast: "A card's title is large text (about 60 px), so 3:1 applies. Score 2 when the median contrast of the unmasked background behind the title box, against white, is 3.0 or more; 1 when it is under 3.0. The title's soft shadow is not counted."

# Shared score sets. The README tops share one set; each differs only where its note says.
score_sets:
  readme: &readme
    logo-variant: {score: null, na: "a README top is text; the repo's social card is its own surface"}
    palette: {score: null, na: "GitHub sets the colors and the top carries no image of its own"}
    type: {score: null, na: "GitHub sets the type and the top carries no image of its own"}
    voice-lint: {score: 2, note: "voice_lint.py on the first 30 lines and the description: 0 FAIL and no hedge, AI tell or unsourced figure. No dash character. No master-brand tagline."}
    clear-space: {score: null, na: no logo}
    contrast: {score: null, na: GitHub sets the colors}
    naming: {score: 2, note: "Colorado Startups in full, and each project's name as the release spells it."}
    register: {score: 2, note: "Plain words and tables, the Core register. Where a keeper appears it is named an AI agent."}

surfaces:
  # The brand guide, live on GitHub Pages.
  - id: guide-page
    channel: brand-guide
    name: The brand guide (14 sections)
    evidence: {url: "https://colorado-startups.github.io/brand/", path: "Colorado-Startups/brand@v3.0.0-alpha.5: guide/public/index.html, guide.css, guide.js, dist/brand.json"}
    read: "2026-11-14"
    how: source (live HTML, guide.css, guide.js and dist/brand.json fetched with curl); image (hero painting and the three logo tiers viewed); sampled (contrast ratios computed from the CSS hex values); voice_lint.py run on every string in brand.json
    scores:
      logo-variant: {score: 0, note: "The page header is the name in Aileron under a red rule, with no logo file (index.html, .top .brand). A kicker in plain type does not count as a logo (rubric logo_needed), and the release has a wordmark and an icon for this slot. The three tiers do load in the Name section, but only when a tier chip is picked. Fix: wordmark-blue.png in the header."}
      palette: {score: 1, note: "dist/tokens.css drives the ground, ink and link roles (decision 54). guide.css still adds hex values that are not tokens: #f3f5fb, #d5dbee, #4a5785 (panel, line and muted), and at night #061450, #26357a, #f4f6ff and the green #7fd6a0. Each is a tint or shade in the State blue family, but none is in dist/tokens.css (#F2F4F8, #D6DAE8 and #384C8F are the nearest tokens)."}
      type: {score: 1, note: "Aileron for h1, h2 and the name, and Trebuchet MS for text, as tokens/type.yaml sets. One stray face: .files code has no font-family, so file paths show in the browser's default monospace."}
      voice-lint: {score: 2, note: "No dash character in index.html, guide.js or brand.json. No tagline anywhere on the page. voice_lint.py reports 0 FAIL. Its WARNs are long sentences in lists and one false hit: the Do and Don't pair 'Delve into a seamless, game-changing tapestry.' is a deliberate counter-example."}
      clear-space: {score: 1, note: "Judged from CSS. The emblem tier shows at 10 rem inside a .specimen padded 2 rem top and bottom, just under a quarter of its height (2.5 rem). The wordmark tier (max 5 rem tall) clears it. The header logo does not exist, so it adds nothing."}
      contrast: {score: 1, note: "Text pairs pass. Recomputed: #001970 on white 15.29, #C3002F link on white 6.25 and on #f3f5fb 5.73, #4a5785 muted on #f3f5fb 6.44, night #f4f6ff on #000a33 17.85, #ffd100 link on #000a33 13.17, #b8c2e8 on #061450 9.74. The hero name is white with a shadow over the dark painting (judged by eye). Misses: the 1 px control borders (--line #d5dbee) are 1.38 on white, under the 3:1 a form control needs. dist/tokens.css already has --c-border #6675A9 for this."}
      naming: {score: 2, note: "Colorado Startups in full, the outposts, keepers and characters as the release spells them."}
      register: {score: 1, note: "Judged, not mapped (see assumptions). The look is plain Core (State blue, Aileron, Trebuchet MS), and the hero is labelled AI-made in its alt text. Hall art and lore words appear as the guide's subject, with plain labels from data/world.yaml, so pieces of the other register are present. The keepers' AI-agent disclosures come from brand.json and the page names them."}
  - id: guide-icons
    channel: brand-guide
    name: Guide favicon, apple-touch icon and manifest icons
    evidence: {url: "https://colorado-startups.github.io/brand/favicon.ico", path: "Colorado-Startups/brand@v3.0.0-alpha.5: dist/logo/ (favicon.ico, apple-touch-icon.png, icon-192.png, icon-512.png), guide/public/manifest.webmanifest"}
    read: "2026-11-14"
    how: "image (apple-touch-icon and icon-192 viewed); source (file(1) on favicon.ico: a real ICO of 16, 32 and 48 px PNG entries; manifest read); sampled (background pixel)"
    scores:
      logo-variant: {score: 2, note: "The icon tier, a white shield on blue, at its own sizes (16 to 512 px) with no effect. The shield reads at 32 px. Before-audit: favicon.ico was a WebP file; it is now a real ICO."}
      palette: {score: 1, note: "The ground is #15428E (sampled at the apple-touch icon's corner), not State Blue #001970. Decision 50 calls it State blue, and logo files carry their own colors (decision 51), so this is a small drift, not a miss."}
      type: {score: null, na: "the icon carries no lettering"}
      voice-lint: {score: null, na: no words}
      clear-space: {score: 2, note: "The shield spans about 56 percent of the 180 px frame, leaving at least 19 percent above and below, over the quarter-height default (14 percent)."}
      contrast: {score: 2, note: "White shield on #15428E is 9.54, over the 3:1 a graphic needs."}
      naming: {score: null, na: no brand name}
      register: {score: null, na: "an icon carries no register"}

  # The org profile on GitHub.
  - id: github-org-avatar
