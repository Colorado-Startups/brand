      voice-lint: {score: null, na: no words}
      clear-space: {score: 1, note: "The shield fills about 85 percent of the square, so the navy margin is about 6 percent, under the quarter-height default. Nothing crowds or crops it, and GitHub rounds the corners only."}
      contrast: {score: null, na: "a logo is exempt from the text rule and the avatar carries no text"}
      naming: {score: null, na: no brand name}
      register: {score: 2, note: "A logo alone, which is Core (data/architecture.yaml registers.core)."}
