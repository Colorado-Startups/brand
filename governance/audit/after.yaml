      clear-space: {score: 2, note: "A 160 px image alone above the heading, with blank space on every side."}
      contrast: {score: null, na: GitHub sets the colors}
      naming: {score: 2, note: Colorado Startups in full.}
      register: {score: 2, note: "Plain text, a logo and a table, which is Core. The registers rule marks this channel Core (data/architecture.yaml)."}

