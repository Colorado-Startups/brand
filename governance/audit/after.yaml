# Computed from the surfaces above by parsing this file with Ruby's Psych (mean of every non-null score;
# cells are channel x rule means). A null cell means no surface in that channel could be scored on that rule.
summary:
  overall_average: 1.77
  surfaces: 22
  scores_counted: 118
  channels:
    brand-guide: {surfaces: 2, average: 1.33, cells: {logo-variant: 1.0, palette: 1.0, type: 1.0, voice-lint: 2.0, clear-space: 1.5, contrast: 1.5, naming: 2.0, register: 1.0}}
    github-org-profile: {surfaces: 2, average: 1.9, cells: {logo-variant: 2.0, palette: 2.0, type: null, voice-lint: 2.0, clear-space: 1.5, contrast: null, naming: 2.0, register: 2.0}}
    github-social-cards: {surfaces: 9, average: 1.76, cells: {logo-variant: 1.0, palette: 2.0, type: 2.0, voice-lint: 2.0, clear-space: 1.33, contrast: 1.78, naming: 2.0, register: 2.0}}
    github-repo-readmes: {surfaces: 9, average: 1.96, cells: {logo-variant: null, palette: null, type: null, voice-lint: 1.89, clear-space: null, contrast: null, naming: 2.0, register: 2.0}}
  # The before-audit's numbers for the same kinds of surface (governance/audit/before.yaml summary).
  # before-audit has no brand-guide or repo-README channel; its nearest rows are the website (a Hall web page),
  # og-cards (the website's social cards) and github-org-profile.
  before_comparison:
    before_overall_average: 1.5
    before_overall_surfaces: 37
    before_channels: {website: 1.88, og-cards: 2.0, github-org-profile: 1.25}
    before_comparable_average: 1.85  # website, og-cards and github-org-profile pooled: 126 points over 68 scores
    after_overall_average: 1.77
    after_beats_before_overall: true   # 1.77 against 1.5, over a different and smaller surface set
    after_beats_before_comparable: false  # 1.77 against 1.85
    by_channel:
      github-org-profile: {before: 1.25, after: 1.9, change: 0.65, note: "Avatar from the default identicon (0) to the emblem (2), and the profile gains the emblem."}
      github-social-cards: {before: 2.0, after: 1.76, change: -0.24, note: "Compared with og-cards. The before-audit scored the website's 13 cards with the shield at about 100 px. The v3 cards carry the name in the wordmark's form and no logo file, and the audit now samples contrast and checks clear space on the painted art."}
      brand-guide: {before: 1.88, after: 1.33, change: -0.55, note: "Compared with the website channel, the closest Hall web page. A different page and a harder read: the guide is new and holds the token and header gaps below."}
  findings:
    - "Overall the v3 surfaces score 1.77 over 118 scores, above the before-audit's 1.5, but below the 1.85 the before-audit gave the same kinds of surface (website, OG cards, org profile). The gain is real where v2 was weakest: the org avatar went from a default identicon to the emblem, and favicon.ico is a real ICO."
    - "Three scores of 0, all on v3 work. The guide's header has no logo file, only the name in type (fix: wordmark-blue.png in the header). The website card, reused by the .github repo, has painted dragons on the name and its red rule, counted once per repo (fix: re-render, or move the title)."
    - "No social card carries a logo file. Each shows the name in the wordmark's form with a shadow, so logo-variant is 1 on all nine. The release has no endorsement artwork yet (the crest waits on the logo, decision 48)."
    - "Two cards have a pale background behind white text, with a sampled median under 3:1: the brand card (2.58) and the startup-credits card (2.61). The photon-mountain and space-peak cards pass on their medians (3.40 and 3.36) but are borderline."
    - "The guide still holds hex values that are not in dist/tokens.css (panel, line, muted, a night panel, a green), and its control borders are 1.38:1 on white. dist/tokens.css has --c-border #6675A9 for the borders."
    - "Repo README tops are clean: voice_lint.py finds no FAIL and no hedge in nine, and the project taglines (photon-mountain, fusion-canyon, startup-credits) are kept as decision 48 allows. One judgment finding: the space-peak README's unsourced claim about the engineering."
  observations:
    - "Not rubric findings: the org avatar is not hash-matched to dist/logo/emblem-512.png, because GitHub re-encodes uploads. The org README loads the emblem from brand main, not a pinned release. The icon's blue (#15428E) is not State Blue (#001970), which decision 50 names."
    - "Scope: 22 surfaces, not 37. The channels the v3 work did not change are not re-scored, so the two overall averages cover different surface sets and the comparison above is a guide, not a controlled one."

# Fixed in v3.0.0, after this audit was scored against v3.0.0-alpha.5 (decision 55). The scores above stand as
# read; these are the changes the findings led to, measured on the v3.0.0 files.
fixed_in_v3_0_0:
  - "Guide header: the emblem (dist/logo/emblem-512.png) beside the name, for the logo-variant 0."
  - "Social cards: a soft navy fade behind the name. Sampled median contrast under the title: brand 5.35 (was 2.58), startup-credits 5.19 (was 2.61); every card's 10th percentile is 3.09 or more."
  - "Icon: mapped onto State Blue; sampled #011A71 against #001970 (was #15428E)."
  - "Guide controls: borders from --c-border, 4.48:1 on white and 6.47:1 on the night ground (was 1.38:1); panel, line and muted colours come from dist/tokens.css."
open_after_v3_0_0:
  - "The coloradostartups.org card, reused by .github: painted dragons sit on the name (clear-space 0). It needs a re-render, which waits for the ZeroGPU daily quota with the guides scene."
closed_in_v3_2_0:
  - "The coloradostartups.org card is re-rendered at seed 52 with open sky behind the name (decision 57). Clear-space 1: rooftops rise under 'tups' and the hill edge sits about 10 px from the last 's'. Contrast 2: median 5.74 against white behind the title, scrim in and shadow out."
  - "The guides scene ships at seed 12, with a map that carries no writing (decision 57)."

